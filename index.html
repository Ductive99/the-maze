<!doctype html>
<html>

<head>
    <title>The Maze</title>
    <script src="p5.js"></script>
    <link rel="stylesheet" href="styles.css" />
    <script src="maze.js"></script>
    <style>
        .github-link {
            position: fixed;
            bottom: 10px;
            right: 10px;
            z-index: 1000;
            background: rgba(255, 255, 255, 0.9);
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 14px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .controls {
            position: fixed;
            top: 10px;
            left: 10px;
            z-index: 1000;
            background: rgba(255, 255, 255, 0.9);
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            font-family: Arial, sans-serif;
            font-size: 14px;
        }

        .control-group {
            margin-bottom: 10px;
        }

        .control-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }

        .control-group input[type="range"] {
            width: 200px;
        }

        .control-group span {
            margin-left: 10px;
            color: #666;
        }

        .reset-btn {
            background: #007acc;
            color: white;
            border: none;
            padding: 5px 15px;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 10px;
        }

        .reset-btn:hover {
            background: #005999;
        }
    </style>
    <a class="github-link" href="https://github.com/ductive99/the-maze" target="_blank" rel="noopener">github repo</a>
</head>

<body>
    <h1>The Maze</h1>

    <div class="controls">
        <div class="control-group">
            <label for="fovSlider">FOV Angle:</label>
            <input type="range" id="fovSlider" min="30" max="120" value="70">
            <span id="fovValue">70°</span>
        </div>

        <div class="control-group">
            <label for="tileSizeSlider">Tile Size:</label>
            <input type="range" id="tileSizeSlider" min="32" max="128" value="64">
            <span id="tileSizeValue">64px</span>
        </div>

        <div class="control-group">
            <label for="wallThicknessSlider">Ray Density</label>
            <input type="range" id="wallThicknessSlider" min="1" max="8" value="3">
            <span id="wallThicknessValue">3px</span>
        </div>

        <button class="reset-btn" onclick="resetToDefaults()">Reset to Defaults</button>
    </div>

    <script>
        // Initialize sliders and event listeners
        const fovSlider = document.getElementById('fovSlider');
        const tileSizeSlider = document.getElementById('tileSizeSlider');
        const wallThicknessSlider = document.getElementById('wallThicknessSlider');

        const fovValue = document.getElementById('fovValue');
        const tileSizeValue = document.getElementById('tileSizeValue');
        const wallThicknessValue = document.getElementById('wallThicknessValue');

        fovSlider.addEventListener('input', function () {
            const value = parseInt(this.value);
            fovValue.textContent = value + '°';
            updateFOV(value);
        });

        tileSizeSlider.addEventListener('input', function () {
            const value = parseInt(this.value);
            tileSizeValue.textContent = value + 'px';
            updateTileSize(value);
        });

        wallThicknessSlider.addEventListener('input', function () {
            const value = parseInt(this.value);
            wallThicknessValue.textContent = value + 'px';
            updateWallThickness(value);
        });

        function resetToDefaults() {
            fovSlider.value = 70;
            tileSizeSlider.value = 64;
            wallThicknessSlider.value = 3;

            fovValue.textContent = '70°';
            tileSizeValue.textContent = '64px';
            wallThicknessValue.textContent = '3px';

            updateFOV(70);
            updateTileSize(64);
            updateWallThickness(3);
        }
    </script>
</body>

</html>
